<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">事件驱动恢复与状态驱动恢复对比</title>
  <desc id="desc">左侧展示事件触发一次恢复后失败即沉默，右侧展示事件先标记 Recovery Pending，再由状态机持续收敛直到 Ready。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d8e0ea; stroke-width: 2; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .label { font: 650 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; rx: 16; }
      .bad { fill: #fff1f2; stroke: #fca5a5; stroke-width: 2; rx: 16; }
      .good { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; rx: 16; }
      .note { fill: #fefce8; stroke: #fde68a; stroke-width: 2; rx: 14; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-red { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="680"/>
  <text x="600" y="58" text-anchor="middle" class="title">事件只能触发，状态才能收敛</text>
  <text x="600" y="90" text-anchor="middle" class="subtitle">同样是网络恢复事件，左侧依赖一次动作，右侧保留 Recovery Pending</text>

  <rect x="70" y="130" width="500" height="470" class="panel" rx="24"/>
  <rect x="630" y="130" width="500" height="470" class="panel" rx="24"/>

  <text x="320" y="178" text-anchor="middle" class="label">事件驱动：发生一次，尝试一次</text>
  <text x="880" y="178" text-anchor="middle" class="label">状态驱动：mark pending，再收敛</text>

  <rect x="135" y="230" width="150" height="70" class="box"/>
  <text x="210" y="258" text-anchor="middle" class="label">reconnect</text>
  <text x="210" y="282" text-anchor="middle" class="small">事件到达</text>

  <rect x="350" y="230" width="150" height="70" class="box"/>
  <text x="425" y="258" text-anchor="middle" class="label">recover()</text>
  <text x="425" y="282" text-anchor="middle" class="small">执行一次</text>
  <path d="M285 265 H345" class="arrow-blue"/>

  <rect x="350" y="360" width="150" height="70" class="bad"/>
  <text x="425" y="388" text-anchor="middle" class="label">失败</text>
  <text x="425" y="412" text-anchor="middle" class="small">HTTP / 订阅异常</text>
  <path d="M425 300 V354" class="arrow-red"/>

  <rect x="135" y="460" width="365" height="72" class="note"/>
  <text x="318" y="490" text-anchor="middle" class="label">事件过去了，pending 仍在</text>
  <text x="318" y="516" text-anchor="middle" class="small">没有新事件，恢复链路就安静下来</text>

  <rect x="690" y="225" width="145" height="70" class="box"/>
  <text x="762" y="253" text-anchor="middle" class="label">事件</text>
  <text x="762" y="277" text-anchor="middle" class="small">reconnect / active</text>

  <rect x="900" y="225" width="145" height="70" class="good"/>
  <text x="972" y="253" text-anchor="middle" class="label">needRecover</text>
  <text x="972" y="277" text-anchor="middle" class="small">mark pending</text>
  <path d="M835 260 H894" class="arrow-green"/>

  <rect x="790" y="355" width="155" height="70" class="box"/>
  <text x="868" y="383" text-anchor="middle" class="label">Recovering</text>
  <text x="868" y="407" text-anchor="middle" class="small">single-flight</text>
  <path d="M972 295 C972 330 935 345 904 354" class="arrow-green"/>

  <rect x="900" y="485" width="145" height="70" class="good"/>
  <text x="972" y="513" text-anchor="middle" class="label">Ready</text>
  <text x="972" y="537" text-anchor="middle" class="small">clear pending</text>
  <path d="M895 425 C913 454 940 468 968 480" class="arrow-green"/>

  <path d="M790 390 C720 390 710 495 790 520 C825 531 866 525 896 517" class="arrow-red dash"/>
  <text x="744" y="465" text-anchor="middle" class="small">失败：keep pending，退避重试</text>
</svg>
