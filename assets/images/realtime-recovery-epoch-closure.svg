<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">恢复闭环与代际隔离</title>
  <desc id="desc">展示 recoverKey A 与 recoverKey B 两代恢复流程。只有同一代的快照和订阅闭环才能进入 Ready，旧代际返回会被阻断。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .lane { fill: #ffffff; stroke: #d8e0ea; stroke-width: 2; }
      .lane-title { font: 750 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; }
      .box-b { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; }
      .stale { fill: #fff1f2; stroke: #fca5a5; stroke-width: 2; }
      .label { font: 650 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .red { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke-dasharray: 8 8; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text x="600" y="62" text-anchor="middle" class="title">恢复成功必须闭环，异步结果必须验明代际</text>
  <text x="600" y="96" text-anchor="middle" class="sub">同一轮恢复里的快照、参数、订阅必须共享同一个 recoverKey</text>

  <rect x="80" y="145" width="1040" height="190" rx="22" class="lane"/>
  <rect x="80" y="395" width="1040" height="190" rx="22" class="lane"/>
  <text x="130" y="178" class="lane-title">旧代际：recoverKey = A</text>
  <text x="130" y="428" class="lane-title">当前代际：recoverKey = B</text>
  <line x1="80" y1="365" x2="1120" y2="365" class="divider"/>

  <rect x="145" y="220" width="145" height="66" rx="14" class="box"/>
  <text x="218" y="247" text-anchor="middle" class="label">请求 A</text>
  <text x="218" y="271" text-anchor="middle" class="small">snapshot(A)</text>

  <rect x="390" y="220" width="145" height="66" rx="14" class="box"/>
  <text x="463" y="247" text-anchor="middle" class="label">参数切换</text>
  <text x="463" y="271" text-anchor="middle" class="small">A -> B</text>
  <path d="M290 253 H384" class="arrow dash"/>

  <rect x="640" y="220" width="170" height="66" rx="14" class="stale"/>
  <text x="725" y="247" text-anchor="middle" class="label">A 晚返回</text>
  <text x="725" y="271" text-anchor="middle" class="small">stale_key</text>
  <path d="M535 253 H634" class="red dash"/>

  <rect x="905" y="220" width="150" height="66" rx="14" class="stale"/>
  <text x="980" y="247" text-anchor="middle" class="label">阻断回写</text>
  <text x="980" y="271" text-anchor="middle" class="small">不能改当前状态</text>
  <path d="M810 253 H899" class="red"/>

  <rect x="145" y="470" width="145" height="66" rx="14" class="box-b"/>
  <text x="218" y="497" text-anchor="middle" class="label">请求 B</text>
  <text x="218" y="521" text-anchor="middle" class="small">snapshot(B)</text>

  <rect x="390" y="470" width="170" height="66" rx="14" class="box-b"/>
  <text x="475" y="497" text-anchor="middle" class="label">订阅上下文</text>
  <text x="475" y="521" text-anchor="middle" class="small">携带 recoverKey B</text>
  <path d="M290 503 H384" class="green"/>

  <rect x="660" y="470" width="170" height="66" rx="14" class="box-b"/>
  <text x="745" y="497" text-anchor="middle" class="label">订阅 B ready</text>
  <text x="745" y="521" text-anchor="middle" class="small">waitSubscribeReady(B)</text>
  <path d="M560 503 H654" class="green"/>

  <rect x="930" y="470" width="125" height="66" rx="14" class="box-b"/>
  <text x="993" y="497" text-anchor="middle" class="label">Ready</text>
  <text x="993" y="521" text-anchor="middle" class="small">clear pending</text>
  <path d="M830 503 H924" class="green"/>

  <text x="600" y="644" text-anchor="middle" class="label">判断规则：不是“系统某处 ready”，而是“本轮 recoverKey 的快照与订阅同时 ready”</text>
  <text x="600" y="674" text-anchor="middle" class="small">旧代际可以返回，但不能拥有当前状态的写权限</text>
</svg>
